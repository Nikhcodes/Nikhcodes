<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150709"/>
      <stop offset="1" stop-color="#0a0405"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#dc2626" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#dc2626" stop-opacity="0.35"/><stop offset="1" stop-color="#dc2626" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect x="8" y="8" width="1184" height="344" rx="22"/></clipPath>
  </defs>
  <style>
    .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .ser{font-family:Georgia,'Times New Roman',serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .row{opacity:0;animation:in .9s cubic-bezier(.2,.7,.2,1) forwards}
    .r1{animation-delay:.2s}.r2{animation-delay:.45s}.r3{animation-delay:.7s}.r4{animation-delay:.95s}.r5{animation-delay:1.2s}
    @keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
    .ping{animation:ping 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
    .sheen{animation:sh 9s ease-in-out infinite}
    @keyframes sh{0%{transform:translateX(-500px)}60%,100%{transform:translateX(1400px)}}
    .orb{animation:orb 12s ease-in-out infinite alternate}
    @keyframes orb{from{transform:translate(0,0)}to{transform:translate(-120px,40px)}}
    .bar{animation:grow 2.2s 1.4s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  </style>
  <rect x="8" y="8" width="1184" height="344" rx="22" fill="url(#card)"/>
  <g clip-path="url(#c)">
    <circle class="orb" cx="1060" cy="70" r="220" fill="url(#glow)"/>
    <rect class="sheen" x="0" y="8" width="420" height="344" fill="url(#sheen)" transform="skewX(-18)"/>
  </g>
  <rect x="8.5" y="8.5" width="1183" height="343" rx="21.5" fill="none" stroke="url(#edge)"/>

  <text x="56" y="62" class="mono" font-size="13" letter-spacing="4" fill="#fca5a5">RIGHT NOW</text>
  <text x="56" y="100" class="ser" font-style="italic" font-size="30" fill="#fff">what my days look like</text>

  <g class="sans" font-size="19">
    <g class="row r1"><circle cx="64" cy="148" r="5" fill="#ef4444"/><circle class="ping" cx="64" cy="148" r="5" fill="#ef4444"/>
      <text x="88" y="155" fill="#f5b4b4" font-size="14" letter-spacing="2" class="mono">WORK</text>
      <text x="220" y="155" fill="#fff">IT Operator at a fintech bank: monitoring, incidents, systems that can't go down</text></g>
    <g class="row r2"><circle cx="64" cy="190" r="5" fill="#f472b6"/>
      <text x="88" y="197" fill="#f5b4b4" font-size="14" letter-spacing="2" class="mono">STUDY</text>
      <text x="220" y="197" fill="#fff">BSc IT / Software Engineering at UNASAT</text></g>
    <g class="row r3"><circle cx="64" cy="232" r="5" fill="#fb923c"/>
      <text x="88" y="239" fill="#f5b4b4" font-size="14" letter-spacing="2" class="mono">BUILD</text>
      <text x="220" y="239" fill="#fff">Java · Spring Boot · PostgreSQL · Spring Security</text></g>
    <g class="row r4"><circle cx="64" cy="274" r="5" fill="#fda4af"/>
      <text x="88" y="281" fill="#f5b4b4" font-size="14" letter-spacing="2" class="mono">READ</text>
      <text x="220" y="281" fill="#fff">OWASP Top 10 · authentication design · caching strategies</text></g>
    <g class="row r5"><circle cx="64" cy="316" r="5" fill="none" stroke="#fca5a5" stroke-width="1.6"/>
      <text x="88" y="323" fill="#f5b4b4" font-size="14" letter-spacing="2" class="mono">NEXT</text>
      <text x="220" y="323" fill="#fff" opacity="0.75">Docker · Nginx · deployment infra</text></g>
  </g>
  <rect class="bar" x="220" y="333" width="200" height="2" rx="1" fill="#dc2626" opacity="0.7"/>
</svg>
