.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.ser{font-family:Georgia,'Times New Roman',serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.orb{animation:orb 12s ease-in-out infinite alternate}
@keyframes orb{from{transform:translate(0,0)}to{transform:translate(-90px,40px)}}
.row{opacity:0;animation:ap 4.5s ease-out infinite}
@keyframes ap{0%{opacity:0;transform:translateY(-10px)}12%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.shackle{animation:sk 4s ease-in-out infinite}
@keyframes sk{0%,60%,100%{transform:translateY(0)}70%{transform:translateY(-8px)}80%{transform:translateY(0)}}</style>
