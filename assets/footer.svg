<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220">
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f1d1d" stop-opacity="0.55"/><stop offset="1" stop-color="#050203"/></linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dc2626" stop-opacity="0.5"/><stop offset="1" stop-color="#050203"/></linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0a10"/><stop offset="1" stop-color="#050203"/></linearGradient>
    <clipPath id="c"><rect width="1200" height="220" rx="22"/></clipPath>
  </defs>
  <style>
    .a{animation:m 14s linear infinite}.b{animation:m 20s linear infinite reverse}.c{animation:m 26s linear infinite}
    @keyframes m{from{transform:translateX(0)}to{transform:translateX(-1200px)}}
    .t{animation:f 5s ease-in-out infinite}
    @keyframes f{0%,100%{opacity:.6}50%{opacity:1}}
    .ser{font-family:Georgia,'Times New Roman',serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="220" fill="#070203"/>
    <text class="ser t" x="600" y="70" text-anchor="middle" font-style="italic" font-size="26" fill="#ffe4e1">trying to understand systems before optimizing them</text>
    <text class="mono" x="600" y="100" text-anchor="middle" font-size="12" letter-spacing="4" fill="#fca5a5" opacity="0.7">NIKHSTUDIOS · PARAMARIBO</text>
    <path class="a" fill="url(#w1)" d="M0 150 Q150 120 300 150 T600 150 T900 150 T1200 150 T1500 150 T1800 150 T2100 150 T2400 150 V220 H0 Z"/>
    <path class="b" fill="url(#w2)" opacity="0.7" d="M0 170 Q150 145 300 170 T600 170 T900 170 T1200 170 T1500 170 T1800 170 T2100 170 T2400 170 V220 H0 Z"/>
    <path class="c" fill="url(#w3)" d="M0 192 Q200 175 400 192 T800 192 T1200 192 T1600 192 T2000 192 T2400 192 V220 H0 Z"/>
  </g>
</svg>
