<svg width="620" height="220" viewBox="0 0 620 220" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, Consolas, monospace">
  <defs>
    <filter id="critGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <path id="cyclePath" d="M 110 60 L 300 60 L 300 160 L 500 160 L 500 60 L 300 60"
        stroke="#3A0A0A" stroke-width="2" fill="none"/>
  <path d="M 500 60 C 560 60 560 160 500 160" stroke="#3A0A0A" stroke-width="2" fill="none"/>

  <circle cx="110" cy="60" r="34" fill="#0D0D0D" stroke="#22C55E" stroke-width="2"/>
  <text x="110" y="65" text-anchor="middle" font-size="12" fill="#E5E5E5">ACTIVE</text>

  <circle cx="300" cy="60" r="34" fill="#0D0D0D" stroke="#CA8A04" stroke-width="2"/>
  <text x="300" y="65" text-anchor="middle" font-size="11" fill="#E5E5E5">WARNING</text>

  <circle cx="300" cy="160" r="34" fill="#0D0D0D" stroke="#2563EB" stroke-width="2"/>
  <text x="300" y="165" text-anchor="middle" font-size="10.5" fill="#E5E5E5">RECOVERY</text>

  <circle cx="500" cy="60" r="36" fill="#0D0D0D" stroke="#DC2626" stroke-width="2.5" filter="url(#critGlow)">
    <animate attributeName="r" values="36;39;36" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="500" y="65" text-anchor="middle" font-size="10.5" fill="#E5E5E5">CRITICAL</text>

  <text x="405" y="50" fill="#8A8A8A" font-size="16">→</text>
  <text x="405" y="180" fill="#8A8A8A" font-size="16">←</text>
  <text x="290" y="115" fill="#8A8A8A" font-size="16" transform="rotate(90 290 115)">→</text>

  <circle r="6" fill="#DC2626">
    <animateMotion dur="6s" repeatCount="indefinite"
      path="M 110 60 L 300 60 L 300 160 L 500 160 L 500 60 C 560 60 560 160 500 160" />
  </circle>
</svg>
