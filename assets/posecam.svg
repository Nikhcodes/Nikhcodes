="animation-delay:1.28s" cx="30" cy="-146" r="4" fill="#fff"/><circle class="lm" style="animation-delay:1.36s" cx="40" cy="-62" r="3" fill="#fff"/><circle class="lm" style="animation-delay:1.44s" cx="52" cy="-90" r="3" fill="#fff"/><circle class="lm" style="animation-delay:1.52s" cx="58" cy="-110" r="3" fill="#fff"/><circle class="lm" style="animation-delay:1.60s" cx="62" cy="-126" r="4" fill="#fff"/></g></g>
