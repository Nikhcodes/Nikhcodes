<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#150709"/><stop offset="1" stop-color="#080304"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185" stop-opacity="0.7"/><stop offset="0.6" stop-color="#fb7185" stop-opacity="0.06"/><stop offset="1" stop-color="#fda4af" stop-opacity="0.4"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fb7185" stop-opacity="0.32"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect x="6" y="6" width="588" height="308" rx="20"/></clipPath>
