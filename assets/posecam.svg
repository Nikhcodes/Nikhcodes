  <style>
.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.ser{font-family:Georgia,'Times New Roman',serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.orb{animation:orb 12s ease-in-out infinite alternate}
@keyframes orb{from{transform:translate(0,0)}to{transform:translate(-90px,40px)}}
.hand{animation:hw 5s ease-in-out infinite;transform-origin:0 0}
@keyframes hw{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-4px)}}
.lm{animation:lm 2s ease-in-out infinite}
@keyframes lm{0%,100%{opacity:.55}50%{opacity:1}}
.scan{animation:sc 4s ease-in-out infinite alternate}
@keyframes sc{from{transform:translateY(0)}to{transform:translateY(150px)}}
.rec{animation:lm 1.2s steps(2) infinite}
.tag{animation:tg 5s ease-in-out infinite}
@keyframes tg{0%,100%{stroke-opacity:.3}50%{stroke-opacity:1}}</style>
  <rect x="6" y="6" width="588" height="308" rx="20" fill="url(#card)"/>
  <g clip-path="url(#c)"><circle class="orb" cx="500" cy="60" r="200" fill="url(#glow)"/>

