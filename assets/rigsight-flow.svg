<svg width="760" height="140" viewBox="0 0 760 140" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, Consolas, monospace">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path id="flowPath" d="M 70 70 L 690 70" stroke="#3A0A0A" stroke-width="2" fill="none"/>

  <g font-size="12.5" fill="#E5E5E5">
    <rect x="10" y="45" width="120" height="50" rx="8" fill="#0D0D0D" stroke="#DC2626" stroke-width="1.3"/>
    <text x="70" y="75" text-anchor="middle">Telemetry</text>

    <rect x="160" y="45" width="150" height="50" rx="8" fill="#0D0D0D" stroke="#DC2626" stroke-width="1.3"/>
    <text x="235" y="75" text-anchor="middle">Threshold Engine</text>

    <rect x="340" y="45" width="140" height="50" rx="8" fill="#0D0D0D" stroke="#DC2626" stroke-width="1.3"/>
    <text x="410" y="75" text-anchor="middle">State Machine</text>

    <rect x="510" y="45" width="140" height="50" rx="8" fill="#0D0D0D" stroke="#DC2626" stroke-width="1.3"/>
    <text x="580" y="75" text-anchor="middle">Alert Dedup</text>

    <rect x="670" y="45" width="80" height="50" rx="8" fill="#0D0D0D" stroke="#DC2626" stroke-width="1.3"/>
    <text x="710" y="70" text-anchor="middle">DB</text>
    <text x="710" y="84" text-anchor="middle" font-size="10" fill="#8A8A8A">persist</text>
  </g>

  <g fill="#8A8A8A" font-size="16">
    <text x="140" y="75">→</text>
    <text x="320" y="75">→</text>
    <text x="490" y="75">→</text>
    <text x="655" y="75">→</text>
  </g>

  <circle r="5" fill="#DC2626" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 70 70 L 690 70"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
