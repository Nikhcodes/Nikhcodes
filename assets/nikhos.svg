<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#150709"/><stop offset="1" stop-color="#080304"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.7"/><stop offset="0.6" stop-color="#a78bfa" stop-opacity="0.06"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0.4"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.32"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect x="6" y="6" width="588" height="308" rx="20"/></clipPath>
  </defs>
  <style>
.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.ser{font-family:Georgia,'Times New Roman',serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.orb{animation:orb 12s ease-in-out infinite alternate}
@keyframes orb{from{transform:translate(0,0)}to{transform:translate(-90px,40px)}}
.c{opacity:0;animation:pop 6s infinite}
.c2{animation-delay:.3s}.c3{animation-delay:.6s}
@keyframes pop{0%{opacity:0;transform:translateY(8px)}10%,85%{opacity:1;transform:none}100%{opacity:0}}
.prog{transform-box:fill-box;transform-origin:left;animation:pg 6s .6s ease-out infinite}
@keyframes pg{0%{transform:scaleX(0)}40%,100%{transform:scaleX(.68)}}
.sel{animation:sel 6s infinite}
@keyframes sel{0%,30%{transform:translateY(0)}35%,65%{transform:translateY(20px)}70%,100%{transform:translateY(40px)}}</style>
  <rect x="6" y="6" width="588" height="308" rx="20" fill="url(#card)"/>
  <g clip-path="url(#c)"><circle class="orb" cx="500" cy="60" r="200" fill="url(#glow)"/>

<g transform="translate(60,34)">
  <rect width="480" height="168" rx="14" fill="#0d0607" stroke="#a78bfa" stroke-opacity="0.35"/>
  <circle cx="18" cy="16" r="4" fill="#ef4444"/><circle cx="32" cy="16" r="4" fill="#fb923c"/><circle cx="46" cy="16" r="4" fill="#4ade80"/>
  <rect x="12" y="32" width="88" height="124" rx="10" fill="#140a14"/>
  <g fill="#fff" opacity="0.5"><rect x="24" y="48" width="56" height="7" rx="3.5"/><rect x="24" y="68" width="44" height="7" rx="3.5"/><rect x="24" y="88" width="50" height="7" rx="3.5"/><rect x="24" y="108" width="38" height="7" rx="3.5"/></g>
  <rect class="sel" x="18" y="42" width="76" height="19" rx="6" fill="#a78bfa" opacity="0.25"/>
  <g class="c c1"><rect x="112" y="32" width="170" height="58" rx="10" fill="#1a0d1d"/><rect x="124" y="46" width="70" height="7" rx="3.5" fill="#c4b5fd"/><text x="124" y="80" class="ser" font-size="22" fill="#fff">8.4</text><text x="166" y="80" class="mono" font-size="10" fill="#c4b5fd">avg grade</text></g>
  <g class="c c2"><rect x="292" y="32" width="176" height="58" rx="10" fill="#1a0d1d"/><rect x="304" y="46" width="60" height="7" rx="3.5" fill="#fca5a5"/><text x="304" y="80" class="ser" font-size="22" fill="#fff">3</text><text x="324" y="80" class="mono" font-size="10" fill="#fca5a5">due this week</text></g>
  <g class="c c3"><rect x="112" y="98" width="356" height="58" rx="10" fill="#1a0d1d"/>
    <rect x="124" y="112" width="332" height="6" rx="3" fill="#fff" opacity="0.1"/><rect class="prog" x="124" y="112" width="332" height="6" rx="3" fill="#a78bfa"/>
    <rect x="124" y="130" width="120" height="7" rx="3.5" fill="#fff" opacity="0.45"/><rect x="252" y="130" width="60" height="7" rx="3.5" fill="#fff" opacity="0.2"/></g>
</g>
  </g>
  <rect x="6.5" y="6.5" width="587" height="307" rx="19.5" fill="none" stroke="url(#edge)"/>
  <text x="34" y="236" class="mono" font-size="11" letter-spacing="3.5" fill="#c4b5fd">LOCAL-FIRST · DAILY DRIVER</text>
  <text x="32" y="270" class="ser" font-style="italic" font-size="32" fill="#fff">NikhOS</text>
  <text x="34" y="296" class="sans" font-size="14" fill="#f5d0d0" opacity="0.8">a calm student workspace I actually use</text>
</svg>