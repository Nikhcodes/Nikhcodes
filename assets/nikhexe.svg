    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef4444" stop-opacity="0.7"/><stop offset="0.6" stop-color="#ef4444" stop-opacity="0.06"/><stop offset="1" stop-color="#fca5a5" stop-opacity="0.4"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ef4444" stop-opacity="0.32"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
