  <g class="m m1"><rect x="270" y="60" width="190" height="30" rx="10" fill="#1d0a0d"/><circle cx="286" cy="75" r="7" fill="#f472b6"/><rect x="300" y="72" width="120" height="6" rx="3" fill="#fff" opacity="0.5"/></g>
