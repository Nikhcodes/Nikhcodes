  <style>
.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.ser{font-family:Georgia,'Times New Roman',serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.orb{animation:orb 12s ease-in-out infinite alternate}
@keyframes orb{from{transform:translate(0,0)}to{transform:translate(-90px,40px)}}
.m{opacity:0;animation:msg 7s infinite}
.m2{animation-delay:1s}.m3{animation-delay:2s}
@keyframes msg{0%{opacity:0;transform:translateX(14px)}8%,80%{opacity:1;transform:none}92%,100%{opacity:0}}
.egg{animation:egg 3.5s ease-in-out infinite}
@keyframes egg{0%,100%{opacity:.2;transform:translate(150px,145px) scale(.6) rotate(0)}50%{opacity:1;transform:translate(150px,138px) scale(1.1) rotate(45deg)}}</style>
