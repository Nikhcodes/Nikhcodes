<svg width="680" height="230" viewBox="0 0 680 230" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, Consolas, monospace">
  <defs>
    <linearGradient id="termBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="678" height="228" rx="10" fill="#050505" stroke="url(#termBorder)" stroke-width="1.5"/>

  <rect x="1" y="1" width="678" height="34" rx="10" fill="#0D0D0D"/>
  <rect x="1" y="26" width="678" height="9" fill="#0D0D0D"/>
  <circle cx="24" cy="18" r="6" fill="#DC2626"/>
  <circle cx="46" cy="18" r="6" fill="#7F1D1D"/>
  <circle cx="68" cy="18" r="6" fill="#3F0A0A"/>
  <text x="340" y="23" fill="#8A8A8A" font-size="12" text-anchor="middle">nikhiel@fintech-ops: ~</text>

  <text x="24" y="66" font-size="15" fill="#DC2626">
    <tspan opacity="0">$ whoami</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.01s" fill="freeze"/>
  </text>

  <text x="24" y="94" font-size="14" fill="#E5E5E5" opacity="0">
    backend-engineer · production-systems · fintech · suriname
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.01s" fill="freeze"/>
  </text>

  <text x="24" y="130" font-size="15" fill="#DC2626" opacity="0">
    $ systemctl status learning.service
    <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.01s" fill="freeze"/>
  </text>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.01s" fill="freeze"/>
    <circle cx="30" cy="153" r="4" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="42" y="158" font-size="14" fill="#E5E5E5">learning.service</text>
    <text x="24" y="180" font-size="13" fill="#8A8A8A">Active: active (running)</text>
    <text x="24" y="198" font-size="13" fill="#8A8A8A">Focus: Spring Security · distributed systems</text>
  </g>

  <rect x="24" y="205" width="9" height="15" fill="#DC2626" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.01s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3.1s" repeatCount="indefinite"/>
  </rect>
</svg>
